<!-- GRÁFICA POR TIPO DE OPERACIÓN -->
<!-- ================================================= -->

<div class="grafica-card">

    <div
        style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        "
    >

        <div>

            <h2
                style="
                    margin: 0;
                    color: #1e293b;
                    font-size: 20px;
                "
            >
                Auditorías por operación
            </h2>

            <p
                style="
                    margin: 5px 0 0;
                    color: #64748b;
                    font-size: 13px;
                "
            >
                Comparación de registros
            </p>

        </div>


        <div
            style="
                background: #eff6ff;
                border: 1px solid #bfdbfe;
                border-radius: 10px;
                padding: 8px 14px;
                text-align: center;
                min-width: 90px;
            "
        >

            <div
                style="
                    font-size: 10px;
                    color: #64748b;
                    font-weight: 600;
                "
            >
                TOTAL
            </div>

            <div
                style="
                    font-size: 24px;
                    font-weight: 700;
                    color: #2563eb;
                "
            >
                {{ Cantidad }}
            </div>

        </div>

    </div>


    <div style="height: 300px;">

        <canvas id="graficaAuditorias"></canvas>

    </div>

</div>
