<div class="grafica-card resultado-tecnico-card">

    <!-- ============================================================
         TÍTULO
         ============================================================ -->

    <div class="resultado-tecnico-header">

        <div class="resultado-tecnico-titulo">

            <h2>
                Resultado de Auditorías por Técnico
            </h2>

            <p class="grafica-descripcion">
                Resumen de auditorías realizadas, porcentaje de error,
                cumplimiento y días auditados.
            </p>

        </div>

    </div>


    <!-- ============================================================
         TABLA
         ============================================================ -->

    <div class="tabla-responsive">

        <table class="tabla-resultado-tecnico">

            <colgroup>
                <col style="width:16%">
                <col style="width:17%">
                <col style="width:11%">
                <col style="width:12%">
                <col style="width:10%">
                <col style="width:11%">
                <col style="width:11%">
                <col style="width:12%">
            </colgroup>

            <thead>

                <!-- ==================================================
                     FILA DE CONTROLES Y ORDENAMIENTO
                     ================================================== -->

                <tr class="fila-ordenamiento">

                    <th
                        colspan="3"
                        class="th-controles"
                    >

                        <div class="resultado-tecnico-controles">

                            <!-- Todos -->

                            <button
                                type="button"
                                id="btnVerTodosTecnicos"
                                class="btn-vista activo"
                            >
                                👥 Todos los técnicos
                            </button>


                            <!-- Sin auditorías -->

                            <button
                                type="button"
                                id="btnVerSinAuditorias"
                                class="btn-vista btn-sin-auditorias"
                            >
                                ⚠️ Técnicos sin auditorías

                                <span id="contadorSinAuditorias">
                                    0
                                </span>

                            </button>

                        </div>

                    </th>


                    <!-- N° Auditorías -->

                    <th>

                        <button
                            type="button"
                            class="btn-orden"
                            data-orden="total"
                            id="ordenTotal"
                        >
                            N° Auditorías
                        </button>

                    </th>


                    <!-- % Error -->

                    <th>

                        <button
                            type="button"
                            class="btn-orden activo"
                            data-orden="porcentaje_error"
                            id="ordenError"
                        >
                            % Error
                        </button>

                    </th>


                    <!-- No Cumple -->

                    <th>

                        <button
                            type="button"
                            class="btn-orden"
                            data-orden="no_cumple"
                            id="ordenNoCumple"
                        >
                            No Cumple
                        </button>

                    </th>


                    <!-- Cumple -->

                    <th>

                        <button
                            type="button"
                            class="btn-orden"
                            data-orden="cumple"
                            id="ordenCumple"
                        >
                            Cumple
                        </button>

                    </th>


                    <!-- Días -->

                    <th>

                        <button
                            type="button"
                            class="btn-orden"
                            data-orden="dias_auditados"
                            id="ordenDias"
                        >
                            Días Auditados
                        </button>

                    </th>

                </tr>


                <!-- ==================================================
                     ENCABEZADOS
                     ================================================== -->

                <tr class="fila-encabezados">

                    <th>
                        Supervisor
                    </th>

                    <th>
                        Técnico
                    </th>

                    <th>
                        Cédula
                    </th>

                    <th>
                        N° Auditorías
                    </th>

                    <th>
                        % Error
                    </th>

                    <th>
                        No Cumple
                    </th>

                    <th>
                        Cumple
                    </th>

                    <th>
                        Días Auditados
                    </th>

                </tr>

            </thead>


            <tbody id="tablaResultadoAuditoriasTecnico">
            </tbody>

        </table>

    </div>

</div>


<script>

(function () {

    "use strict";


    /* ============================================================
       ESTADO GLOBAL
       ============================================================ */

    window.estadoResultadoTecnicos =
        window.estadoResultadoTecnicos || {

            orden: "porcentaje_error",

            vista: "todos"

        };


    /* ============================================================
       OBTENER DATOS GLOBALES
       ============================================================ */

    function obtenerDatosTecnicos() {

        const datos =
            window.Resultado_Auditorias_Tecnico;


        if (Array.isArray(datos)) {

            return datos;

        }


        if (
            datos &&
            Array.isArray(datos.data)
        ) {

            return datos.data;

        }


        if (
            datos &&
            Array.isArray(datos.resultado)
        ) {

            return datos.resultado;

        }


        if (
            datos &&
            Array.isArray(datos.datos)
        ) {

            return datos.datos;

        }


        return [];

    }


    window.obtenerDatosTecnicos =
        obtenerDatosTecnicos;


    /* ============================================================
       CONVERTIR A NÚMERO
       ============================================================ */

    function numero(valor) {

        if (
            valor === null ||
            valor === undefined ||
            valor === ""
        ) {

            return 0;

        }


        if (typeof valor === "number") {

            return Number.isFinite(valor)
                ? valor
                : 0;

        }


        let valorLimpio =
            String(valor)
                .trim()
                .replace("%", "")
                .replace(/\s/g, "");


        if (
            valorLimpio.includes(",") &&
            valorLimpio.includes(".")
        ) {

            valorLimpio =
                valorLimpio
                    .replace(/\./g, "")
                    .replace(",", ".");

        }

        else if (
            valorLimpio.includes(",")
        ) {

            valorLimpio =
                valorLimpio.replace(",", ".");

        }


        const resultado =
            Number(valorLimpio);


        return Number.isFinite(resultado)
            ? resultado
            : 0;

    }


    window.numeroResultadoTecnicos =
        numero;


    /* ============================================================
       TEXTO
       ============================================================ */

    function texto(valor, defecto) {

        if (
            valor === null ||
            valor === undefined ||
            String(valor).trim() === ""
        ) {

            return defecto || "";

        }


        return String(valor);

    }


    /* ============================================================
       ESCAPAR HTML
       ============================================================ */

    function escaparHTML(valor) {

        return String(valor)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }


    /* ============================================================
       TOTAL AUDITORÍAS
       ============================================================ */

    function obtenerTotal(item) {

        return numero(

            item.total ??
            item.total_auditorias ??
            item.numero_auditorias ??
            item.n_auditorias ??
            item.auditorias ??
            item.cantidad_auditorias ??
            0

        );

    }


    /* ============================================================
       PORCENTAJE ERROR
       ============================================================ */

    function obtenerError(item) {

        return numero(

            item.porcentaje_error ??
            item.porcentajeError ??
            item.error_porcentaje ??
            item.error ??
            0

        );

    }


    /* ============================================================
       NO CUMPLE
       ============================================================ */

    function obtenerNoCumple(item) {

        return numero(

            item.no_cumple ??
            item.noCumple ??
            item.total_no_cumple ??
            item.totalNoCumple ??
            item.cantidad_no_cumple ??
            0

        );

    }


    /* ============================================================
       CUMPLE
       ============================================================ */

    function obtenerCumple(item) {

        return numero(

            item.cumple ??
            item.total_cumple ??
            item.totalCumple ??
            item.cantidad_cumple ??
            0

        );

    }


    /* ============================================================
       DÍAS AUDITADOS
       ============================================================ */

    function obtenerDias(item) {

        return numero(

            item.dias_auditados ??
            item.diasAuditados ??
            item.dias_auditados_total ??
            item.dias ??
            0

        );

    }


    /* ============================================================
       SUPERVISOR
       ============================================================ */

    function obtenerSupervisor(item) {

        return texto(

            item.supervisor ??
            item.nombre_supervisor ??
            item.supervisor_nombre ??
            item.nombreSupervisor,

            "Sin supervisor"

        );

    }


    /* ============================================================
       TÉCNICO
       ============================================================ */

    function obtenerTecnico(item) {

        return texto(

            item.tecnico ??
            item.nombre_tecnico ??
            item.tecnico_nombre ??
            item.nombreTecnico ??
            item.nombre,

            "Sin nombre"

        );

    }


    /* ============================================================
       CÉDULA
       ============================================================ */

    function obtenerCedula(item) {

        return texto(

            item.cedula ??
            item.documento ??
            item.identificacion ??
            item.identificacion_tecnico ??
            item.cedula_tecnico,

            "N/A"

        );

    }


    /* ============================================================
       TIENE AUDITORÍAS
       ============================================================ */

    function tieneAuditorias(item) {

        const valor =
            item.tiene_auditorias ??
            item.tieneAuditorias;


        if (
            valor === true ||
            valor === 1 ||
            valor === "1" ||
            valor === "true" ||
            valor === "True" ||
            valor === "TRUE" ||
            valor === "SI" ||
            valor === "Si" ||
            valor === "Sí" ||
            valor === "sí"
        ) {

            return true;

        }


        return obtenerTotal(item) > 0;

    }


    /* ============================================================
       FORMATEAR NÚMERO
       ============================================================ */

    function formatearNumero(valor) {

        return numero(valor)
            .toLocaleString("es-CO");

    }


    /* ============================================================
       FORMATEAR PORCENTAJE
       ============================================================ */

    function formatearPorcentaje(valor) {

        const numeroFormateado =
            numero(valor).toFixed(2);


        return numeroFormateado

            .replace(/\.00$/, "")

            .replace(/(\.\d)0$/, "$1")

            + "%";

    }


    /* ============================================================
       ACTUALIZAR RESUMEN
       ============================================================ */

    function actualizarResumen() {

        const datos =
            obtenerDatosTecnicos();


        const totalTecnicos =
            datos.length;


        const totalAuditados =
            datos.filter(function (item) {

                return tieneAuditorias(item);

            }).length;


        const totalSinAuditoria =
            totalTecnicos -
            totalAuditados;


        const cobertura =
            totalTecnicos > 0

                ? (
                    totalAuditados /
                    totalTecnicos
                ) * 100

                : 0;


        const porcentajeSinAuditoria =
            totalTecnicos > 0

                ? (
                    totalSinAuditoria /
                    totalTecnicos
                ) * 100

                : 0;


        const elementos = {

            total:
                document.getElementById(
                    "totalTecnicos"
                ),

            auditados:
                document.getElementById(
                    "totalTecnicosAuditados"
                ),

            cobertura:
                document.getElementById(
                    "porcentajeCobertura"
                ),

            sinAuditoria:
                document.getElementById(
                    "totalTecnicosSinAuditoria"
                ),

            porcentajeSin:
                document.getElementById(
                    "porcentajeTecnicosSinAuditoria"
                ),

            contador:
                document.getElementById(
                    "contadorSinAuditorias"
                )

        };


        if (elementos.total) {

            elementos.total.textContent =
                formatearNumero(
                    totalTecnicos
                );

        }


        if (elementos.auditados) {

            elementos.auditados.textContent =
                formatearNumero(
                    totalAuditados
                );

        }


        if (elementos.cobertura) {

            elementos.cobertura.textContent =
                formatearPorcentaje(
                    cobertura
                );

        }


        if (elementos.sinAuditoria) {

            elementos.sinAuditoria.textContent =
                formatearNumero(
                    totalSinAuditoria
                );

        }


        if (elementos.porcentajeSin) {

            elementos.porcentajeSin.textContent =
                formatearPorcentaje(
                    porcentajeSinAuditoria
                );

        }


        if (elementos.contador) {

            elementos.contador.textContent =
                formatearNumero(
                    totalSinAuditoria
                );

        }


        return {

            totalTecnicos:
                totalTecnicos,

            totalAuditados:
                totalAuditados,

            totalSinAuditoria:
                totalSinAuditoria,

            cobertura:
                cobertura,

            porcentajeSinAuditoria:
                porcentajeSinAuditoria

        };

    }


    window.obtenerResumenTecnicos =
        actualizarResumen;


    /* ============================================================
       VALOR PARA ORDENAMIENTO
       ============================================================ */

    function obtenerValorOrden(item, campo) {

        switch (campo) {

            case "total":

                return obtenerTotal(item);


            case "porcentaje_error":

                return obtenerError(item);


            case "no_cumple":

                return obtenerNoCumple(item);


            case "cumple":

                return obtenerCumple(item);


            case "dias_auditados":

                return obtenerDias(item);


            default:

                return 0;

        }

    }


    /* ============================================================
       ACTUALIZAR BOTONES DE ORDEN
       ============================================================ */

    function actualizarBotonesOrden() {

        document

            .querySelectorAll(
                ".resultado-tecnico-card .btn-orden"
            )

            .forEach(function (boton) {

                boton.classList.toggle(

                    "activo",

                    boton.dataset.orden ===
                    window.estadoResultadoTecnicos.orden

                );

            });

    }


    /* ============================================================
       ACTUALIZAR BOTONES DE VISTA
       ============================================================ */

    function actualizarBotonesVista() {

        const todos =
            document.getElementById(
                "btnVerTodosTecnicos"
            );


        const sin =
            document.getElementById(
                "btnVerSinAuditorias"
            );


        if (todos) {

            todos.classList.toggle(

                "activo",

                window.estadoResultadoTecnicos.vista ===
                "todos"

            );

        }


        if (sin) {

            sin.classList.toggle(

                "activo",

                window.estadoResultadoTecnicos.vista ===
                "sin_auditorias"

            );

        }

    }


    /* ============================================================
       ORDENAR TÉCNICOS
       ============================================================ */

    function ordenarTecnicos(campo) {

        if (!campo) {

            return;

        }


        window.estadoResultadoTecnicos.orden =
            campo;


        actualizarBotonesOrden();

        renderizarTablaResultadoTecnico();

    }


    window.ordenarTecnicos =
        ordenarTecnicos;


    /* ============================================================
       CAMBIAR VISTA
       ============================================================ */

    function cambiarVistaTecnicos(vista) {

        if (
            vista !== "todos" &&
            vista !== "sin_auditorias"
        ) {

            vista = "todos";

        }


        window.estadoResultadoTecnicos.vista =
            vista;


        actualizarBotonesVista();

        renderizarTablaResultadoTecnico();

    }


    window.cambiarVistaTecnicos =
        cambiarVistaTecnicos;


    /* ============================================================
       RENDERIZAR TABLA
       ============================================================ */

    function renderizarTablaResultadoTecnico() {

        const tbody =
            document.getElementById(
                "tablaResultadoAuditoriasTecnico"
            );


        if (!tbody) {

            return;

        }


        const datosOriginales =
            obtenerDatosTecnicos();


        /* ========================================================
           SIN DATOS
           ======================================================== */

        if (
            !Array.isArray(datosOriginales) ||
            datosOriginales.length === 0
        ) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="sin-datos"
                    >
                        Esperando datos de técnicos...
                    </td>

                </tr>

            `;


            actualizarResumen();

            return;

        }


        let datos =
            datosOriginales.slice();


        /* ========================================================
           FILTRO
           ======================================================== */

        if (
            window.estadoResultadoTecnicos.vista ===
            "sin_auditorias"
        ) {

            datos =
                datos.filter(function (item) {

                    return !tieneAuditorias(item);

                });

        }


        /* ========================================================
           ORDENAMIENTO
           ======================================================== */

        const campo =
            window.estadoResultadoTecnicos.orden;


        datos.sort(function (a, b) {

            const auditadoA =
                tieneAuditorias(a);


            const auditadoB =
                tieneAuditorias(b);


            /*
             * En vista TODOS:
             * técnicos auditados primero.
             */

            if (
                window.estadoResultadoTecnicos.vista ===
                "todos" &&
                auditadoA !== auditadoB
            ) {

                return auditadoA
                    ? -1
                    : 1;

            }


            const valorA =
                obtenerValorOrden(
                    a,
                    campo
                );


            const valorB =
                obtenerValorOrden(
                    b,
                    campo
                );


            if (valorA !== valorB) {

                return valorB - valorA;

            }


            /* ====================================================
               SEGUNDO ORDEN: SUPERVISOR
               ==================================================== */

            const supervisorA =
                obtenerSupervisor(a);


            const supervisorB =
                obtenerSupervisor(b);


            const comparacionSupervisor =
                supervisorA.localeCompare(

                    supervisorB,

                    "es",

                    {
                        sensitivity: "base"
                    }

                );


            if (
                comparacionSupervisor !== 0
            ) {

                return comparacionSupervisor;

            }


            /* ====================================================
               TERCER ORDEN: TÉCNICO
               ==================================================== */

            return obtenerTecnico(a)
                .localeCompare(

                    obtenerTecnico(b),

                    "es",

                    {
                        sensitivity: "base"
                    }

                );

        });


        /* ========================================================
           SIN RESULTADOS
           ======================================================== */

        if (datos.length === 0) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="sin-datos"
                    >
                        No existen técnicos sin auditorías.
                    </td>

                </tr>

            `;


            actualizarResumen();

            return;

        }


        /* ========================================================
           CREAR HTML
           ======================================================== */

        let html = "";


        datos.forEach(function (item) {

            const supervisor =
                obtenerSupervisor(item);


            const tecnico =
                obtenerTecnico(item);


            const cedula =
                obtenerCedula(item);


            const auditado =
                tieneAuditorias(item);


            const total =
                obtenerTotal(item);


            const error =
                obtenerError(item);


            const noCumple =
                obtenerNoCumple(item);


            const cumple =
                obtenerCumple(item);


            const dias =
                obtenerDias(item);


            const claseFila =
                auditado
                    ? ""
                    : "fila-sin-auditoria";


            html += `

                <tr class="${claseFila}">

                    <td>
                        ${escaparHTML(supervisor)}
                    </td>


                    <td>
                        ${escaparHTML(tecnico)}
                    </td>


                    <td>
                        ${escaparHTML(cedula)}
                    </td>


                    <td class="valor-total">

                        ${
                            auditado

                            ? formatearNumero(total)

                            : `<span class="valor-na">
                                N/A
                              </span>`
                        }

                    </td>


                    <td class="porcentaje-error">

                        ${
                            auditado

                            ? formatearPorcentaje(error)

                            : `<span class="valor-na">
                                N/A
                              </span>`
                        }

                    </td>


                    <td class="valor-no-cumple">

                        ${
                            auditado

                            ? formatearNumero(noCumple)

                            : `<span class="valor-na">
                                N/A
                              </span>`
                        }

                    </td>


                    <td class="valor-cumple">

                        ${
                            auditado

                            ? formatearNumero(cumple)

                            : `<span class="valor-na">
                                N/A
                              </span>`
                        }

                    </td>


                    <td class="valor-dias">

                        ${
                            auditado

                            ? formatearNumero(dias)

                            : `<span class="valor-na">
                                N/A
                              </span>`
                        }

                    </td>

                </tr>

            `;

        });


        tbody.innerHTML =
            html;


        actualizarResumen();

    }


    window.renderizarTablaResultadoTecnico =
        renderizarTablaResultadoTecnico;


    /* ============================================================
       ACTUALIZACIÓN GENERAL
       ============================================================ */

    function actualizarResultadoTecnicos() {

        actualizarResumen();

        actualizarBotonesOrden();

        actualizarBotonesVista();

        renderizarTablaResultadoTecnico();

    }


    window.actualizarResultadoTecnicos =
        actualizarResultadoTecnicos;


    /* ============================================================
       EVENTOS
       ============================================================ */

    function configurarEventos() {

        const card =
            document.querySelector(
                ".resultado-tecnico-card"
            );


        if (!card) {

            return;

        }


        /*
         * Evitar registrar eventos dos veces.
         */

        if (
            card.dataset.eventosConfigurados ===
            "true"
        ) {

            return;

        }


        card.dataset.eventosConfigurados =
            "true";


        /* ========================================================
           BOTONES DE ORDEN
           ======================================================== */

        card

            .querySelectorAll(
                ".btn-orden"
            )

            .forEach(function (boton) {

                boton.addEventListener(

                    "click",

                    function () {

                        ordenarTecnicos(
                            boton.dataset.orden
                        );

                    }

                );

            });


        /* ========================================================
           TODOS
           ======================================================== */

        const btnTodos =
            document.getElementById(
                "btnVerTodosTecnicos"
            );


        if (btnTodos) {

            btnTodos.addEventListener(

                "click",

                function () {

                    cambiarVistaTecnicos(
                        "todos"
                    );

                }

            );

        }


        /* ========================================================
           SIN AUDITORÍAS
           ======================================================== */

        const btnSin =
            document.getElementById(
                "btnVerSinAuditorias"
            );


        if (btnSin) {

            btnSin.addEventListener(

                "click",

                function () {

                    cambiarVistaTecnicos(
                        "sin_auditorias"
                    );

                }

            );

        }

    }


    /* ============================================================
       INICIALIZACIÓN
       ============================================================ */

    function inicializar() {

        configurarEventos();

        actualizarResultadoTecnicos();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            inicializar
        );

    }

    else {

        inicializar();

    }


})();

</script>


<style>

/* ============================================================
   CONTENEDOR
   ============================================================ */

.resultado-tecnico-card {

    width: 100%;

    max-width: 100%;

    min-width: 0;

    box-sizing: border-box;

}


/* ============================================================
   ENCABEZADO / TÍTULO
   ============================================================ */

.resultado-tecnico-header {

    width: 100%;

    margin-bottom: 10px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 30px;

    box-sizing: border-box;

    padding: 12px 0;

}


.resultado-tecnico-titulo {

    flex: 1;

    min-width: 0;

}


.resultado-tecnico-header h2 {

    margin: 0 0 6px;

    color: #0f172a;

    font-size: 22px;

    font-weight: 700;

    line-height: 1.3;

}


.grafica-descripcion {

    margin: 0;

    color: #64748b;

    font-size: 14px;

    line-height: 1.5;

}


/* ============================================================
   RESUMEN FIJO
   ============================================================ */

.resumen-fijo {

    position: sticky;

    top: 0;

    z-index: 100;

    width: 100%;

    background: #ffffff;

    padding: 8px 0 12px;

    margin-bottom: 12px;

    box-sizing: border-box;

}


/* ============================================================
   RESUMEN
   ============================================================ */

.resumen-comparacion {

    display: grid;

    grid-template-columns:
