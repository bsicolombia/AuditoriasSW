<!-- ================================================= -->
<!-- GRÁFICA POR TÉCNICO -->
<!-- ================================================= -->

<div class="grafica-card">

    <div
        style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        "
    >

        <div>

            <h2
                style="
                    margin: 0;
                    color: #1e293b;
                    font-size: 20px;
                "
            >
                Auditorías por técnico
            </h2>

            <p
                style="
                    margin: 5px 0 0;
                    color: #64748b;
                    font-size: 13px;
                "
            >
                Cantidad realizada por técnico
            </p>

        </div>


        <div
            style="
                background: #f5f3ff;
                border: 1px solid #ddd6fe;
                border-radius: 10px;
                padding: 8px 14px;
                text-align: center;
                min-width: 80px;
            "
        >

            <div
                style="
                    font-size: 10px;
                    color: #64748b;
                    font-weight: 600;
                "
            >
                TÉCNICOS
            </div>

            <div
                style="
                    font-size: 24px;
                    font-weight: 700;
                    color: #7c3aed;
                "
            >
                {{ Cantidad_Tecnicos }}
            </div>

        </div>

    </div>


    <div style="margin-bottom: 15px;">

        <select id="filtroTecnico">

            <option value="todos">
                Todos los técnicos
            </option>

        </select>

    </div>


    <div
        style="
            max-height: 350px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 8px;
        "
    >

        <div id="contenedorGraficaTecnicos">

            <canvas id="graficaTecnicos"></canvas>

        </div>

    </div>

</div>
